[tool.ruff]
line-length = 120
target-version = "py312"
src = ["app", "tests"]
extend-exclude = ["alembic/versions"]  # autogenerated, not hand-maintained

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI's Depends() is meant to live in argument defaults

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"